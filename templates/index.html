<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Room</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <form id="roomForm" class="card" method="POST" action="/">
        <h1>{{ 'Host' if role == 'host' else 'Join' }} Watch Room</h1>
        <p class="subtitle">Paste a YouTube video link to {{ 'start' if role == 'host' else 'join' }} a synchronized room.</p>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <input type="hidden" name="role" value="{{ role }}">
        <input name="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
        <button id="roomSubmit" type="submit">{{ 'Start Room' if role == 'host' else 'Join Room' }}</button>
    </form>
</body>

</html>
